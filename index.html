<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1769aa">
<meta name="application-name" content="A4 桌牌">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="A4 桌牌">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>A4 桌牌排版工具</title>
<style>
  :root {
    --page-w: 210mm;
    --page-h: 297mm;
    --ink: #111;
    --muted: #666;
    --ui-bg: #f4f5f7;
    --panel: #fff;
    --border: #d8d8d8;
    --accent: #1769aa;
    --page-line: #aaa;
  }
  * { box-sizing: border-box; }
  html { font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; }
  body { margin: 0; background: var(--ui-bg); color: var(--ink); }
  button, input, textarea { font: inherit; }
  .app { min-height: 100vh; display: grid; grid-template-columns: minmax(300px, 390px) minmax(0, 1fr); }
  .controls {
    background: var(--panel); border-right: 1px solid var(--border); padding: 20px;
    position: sticky; top: 0; height: 100vh; overflow: auto;
  }
  h1 { margin: 0 0 8px; font-size: 22px; }
  .hint { margin: 0 0 16px; color: var(--muted); font-size: 14px; line-height: 1.6; }
  label { display: block; margin: 14px 0 6px; font-size: 14px; font-weight: 700; }
  textarea, input[type="number"], input[type="file"] { width: 100%; }
  textarea { min-height: 280px; padding: 10px; border: 1px solid #bbb; border-radius: 8px; resize: vertical; line-height: 1.5; }
  input[type="number"], input[type="file"] { padding: 8px; border: 1px solid #bbb; border-radius: 8px; background: transparent; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  button { border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 700; cursor: pointer; background: #e8e8e8; color: #111; }
  button.primary { background: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .image-tools { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .image-note { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .status { margin-top: 12px; color: var(--muted); font-size: 13px; min-height: 1.5em; }
  .preview { min-width: 0; padding: 20px; overflow: auto; }
  .preview-title { margin: 0 auto 12px; max-width: 900px; color: var(--muted); font-size: 14px; }
  .page-wrap { width: fit-content; margin: 0 auto 18px; }
  .page {
    width: var(--page-w); height: var(--page-h); background: #fff; color: #111;
    display: grid; grid-template-rows: repeat(4, minmax(0, 1fr));
    box-shadow: 0 2px 18px rgba(0,0,0,.13); break-after: page; page-break-after: always;
  }
  .face {
    min-height: 0; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr);
    overflow: hidden; position: relative;
  }
  .face.inverted { transform: rotate(180deg); }
  .face.with-image { grid-template-columns: var(--image-col, 42mm) minmax(0, 1fr); }
  .image-cell { display: none; min-width: 0; min-height: 0; align-items: center; justify-content: center; padding: 4mm 3mm; overflow: hidden; }
  .with-image .image-cell { display: flex; }
  .image-cell img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
  .text-cell { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4mm; }
  .text-stack { width: 100%; max-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 1.4mm; overflow: hidden; }
  .text-line { white-space: nowrap; text-align: center; line-height: 1.02; font-weight: 500; }
  .page { position: relative; }
  .guide { position: absolute; left: 4mm; right: 4mm; z-index: 2; pointer-events: none; }
  .guide.fold-1 { top: 25%; border-top: .2mm dotted #c9c9c9; }
  .guide.cut { top: 50%; left: 0; right: 0; border-top: .25mm dashed var(--page-line); }
  .guide.fold-2 { top: 75%; border-top: .2mm dotted #c9c9c9; }
  .empty { max-width: 720px; margin: 36px auto; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 12px; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .controls { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
    .preview { padding: 12px; }
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eee; --muted: #aaa; --ui-bg: #171717; --panel: #222; --border: #444; }
    textarea, input[type="number"], input[type="file"] { border-color: #555; color: #eee; }
    button { background: #3b3b3b; color: #eee; }
  }
  @page { size: A4 portrait; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .controls, .preview-title { display: none !important; }
    .app { display: block; min-height: 0; }
    .preview { padding: 0; overflow: visible; }
    .page-wrap { margin: 0; }
    .page { margin: 0; box-shadow: none; }
    .page:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="controls">
    <h1>A4 桌牌排版工具</h1>
    <p class="hint">每人輸入一個區塊，空白行分隔下一位。每位自動做成「上方倒轉、下方正向」的頭對頭桌牌，一張 A4 排兩位。文字會自動放到盡可能大並上下左右置中。</p>

    <label for="data">桌牌內容</label>
    <textarea id="data" placeholder="例如：&#10;單位名稱&#10;姓名 職稱&#10;&#10;下一位的單位&#10;姓名 職稱"></textarea>

    <div class="row">
      <div>
        <label for="padding">文字左右留白（mm）</label>
        <input id="padding" type="number" min="0" max="20" step="0.5" value="4">
      </div>
      <div>
        <label for="gap">行距（mm）</label>
        <input id="gap" type="number" min="0" max="12" step="0.2" value="1.4">
      </div>
    </div>

    <label for="imageInput">圖片（選用）</label>
    <input id="imageInput" type="file" accept="image/*">
    <div class="image-tools">
      <button id="clearImageBtn" type="button" disabled>移除圖片</button>
      <span id="imageState" class="image-note">未使用圖片</span>
    </div>
    <p class="image-note">圖片只在你的瀏覽器記憶體裡處理，不會上傳到任何伺服器。選圖後會自動出現在每個桌牌左側。</p>

    <div class="buttons">
      <button id="renderBtn" class="primary" type="button">重新排版</button>
      <button id="printBtn" type="button">列印 / 存成 PDF</button>
      <button id="installBtn" type="button" hidden>安裝成 App</button>
    </div>
    <div id="status" class="status" aria-live="polite"></div>
  </aside>

  <main class="preview">
    <p class="preview-title">A4 直式，每頁 2 位；每位佔半張 A4，上半面倒轉 180°、下半面正向。中間虛線是裁切位置，細點線是每張桌牌的折線參考。</p>
    <div id="pages"></div>
  </main>
</div>

<script>
(() => {
  const $ = (selector) => document.querySelector(selector);
  const dataEl = $('#data');
  const pagesEl = $('#pages');
  const paddingEl = $('#padding');
  const gapEl = $('#gap');
  const imageInput = $('#imageInput');
  const clearImageBtn = $('#clearImageBtn');
  const imageState = $('#imageState');
  const statusEl = $('#status');
  const renderBtn = $('#renderBtn');
  const printBtn = $('#printBtn');
  const installBtn = $('#installBtn');

  let imageSrc = '';
  let renderTimer = null;
  let installPrompt = null;

  function parseCards(raw) {
    return raw
      .replace(/\r/g, '')
      .trim()
      .split(/\n\s*\n+/)
      .map(block => block.split('\n').map(line => line.trim()).filter(Boolean))
      .filter(lines => lines.length > 0);
  }

  function clampNumber(el, fallback, min, max) {
    const value = Number(el.value);
    if (!Number.isFinite(value)) return fallback;
    return Math.min(max, Math.max(min, value));
  }

  function makeFace(lines, inverted) {
    const face = document.createElement('section');
    face.className = 'face' + (inverted ? ' inverted' : '') + (imageSrc ? ' with-image' : '');

    const imageCell = document.createElement('div');
    imageCell.className = 'image-cell';
    if (imageSrc) {
      const img = document.createElement('img');
      img.src = imageSrc;
      img.alt = '桌牌圖片';
      imageCell.appendChild(img);
    }

    const textCell = document.createElement('div');
    textCell.className = 'text-cell';
    const sidePadding = clampNumber(paddingEl, 4, 0, 20);
    textCell.style.paddingLeft = sidePadding + 'mm';
    textCell.style.paddingRight = sidePadding + 'mm';

    const stack = document.createElement('div');
    stack.className = 'text-stack';
    stack.style.gap = clampNumber(gapEl, 1.4, 0, 12) + 'mm';

    for (const line of lines) {
      const el = document.createElement('div');
      el.className = 'text-line';
      el.textContent = line;
      stack.appendChild(el);
    }

    textCell.appendChild(stack);
    face.append(imageCell, textCell);
    return face;
  }

  function makeBlankFace(inverted) {
    const face = document.createElement('section');
    face.className = 'face' + (inverted ? ' inverted' : '') + (imageSrc ? ' with-image' : '');
    const imageCell = document.createElement('div');
    imageCell.className = 'image-cell';
    const textCell = document.createElement('div');
    textCell.className = 'text-cell';
    face.append(imageCell, textCell);
    return face;
  }

  function fitLine(lineEl, maxWidth, maxHeight) {
    let low = 1;
    let high = 300;

    // .text-line is a block element, so getBoundingClientRect().width mostly
    // reports the container width, not the actual rendered text width.
    // scrollWidth exposes the real no-wrap text width once it would overflow.
    for (let i = 0; i < 16; i++) {
      const mid = (low + high) / 2;
      lineEl.style.fontSize = mid + 'px';

      const rect = lineEl.getBoundingClientRect();
      const actualWidth = lineEl.scrollWidth;
      const actualHeight = rect.height;

      if (actualWidth <= maxWidth + 0.5 && actualHeight <= maxHeight + 0.5) low = mid;
      else high = mid;
    }

    lineEl.style.fontSize = Math.max(1, low * 0.98) + 'px';
  }

  function fitAll() {
    const faces = [...pagesEl.querySelectorAll('.face')];
    for (const face of faces) {
      const textCell = face.querySelector('.text-cell');
      const stack = face.querySelector('.text-stack');
      if (!stack) continue;

      const lines = [...stack.querySelectorAll('.text-line')];
      if (!lines.length) continue;

      const cellStyle = getComputedStyle(textCell);
      const width = textCell.clientWidth - parseFloat(cellStyle.paddingLeft) - parseFloat(cellStyle.paddingRight);
      const height = textCell.clientHeight - parseFloat(cellStyle.paddingTop) - parseFloat(cellStyle.paddingBottom);
      const stackStyle = getComputedStyle(stack);
      const gapPx = parseFloat(stackStyle.rowGap || stackStyle.gap) || 0;
      const usableHeight = Math.max(1, height - gapPx * Math.max(0, lines.length - 1));
      const perLineHeight = usableHeight / lines.length;

      for (const line of lines) fitLine(line, width, perLineHeight * 0.94);

      const stackRect = stack.getBoundingClientRect();
      const cellRect = textCell.getBoundingClientRect();
      if (stackRect.height > cellRect.height * 0.98) {
        const ratio = (cellRect.height * 0.98) / stackRect.height;
        for (const line of lines) {
          const size = parseFloat(getComputedStyle(line).fontSize);
          line.style.fontSize = Math.max(8, size * ratio) + 'px';
        }
      }
    }
  }

  function render() {
    const cards = parseCards(dataEl.value);
    pagesEl.replaceChildren();

    if (!cards.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '輸入桌牌內容後，預覽會出現在這裡。';
      pagesEl.appendChild(empty);
      statusEl.textContent = '0 位';
      return;
    }

    for (let i = 0; i < cards.length; i += 2) {
      const wrap = document.createElement('div');
      wrap.className = 'page-wrap';
      const page = document.createElement('div');
      page.className = 'page';
      const first = cards[i];
      const second = cards[i + 1];

      page.appendChild(makeFace(first, true));
      page.appendChild(makeFace(first, false));

      if (second) {
        page.appendChild(makeFace(second, true));
        page.appendChild(makeFace(second, false));
      } else {
        page.appendChild(makeBlankFace(true));
        page.appendChild(makeBlankFace(false));
      }

      for (const cls of ['fold-1', 'cut', 'fold-2']) {
        const guide = document.createElement('div');
        guide.className = 'guide ' + cls;
        guide.setAttribute('aria-hidden', 'true');
        page.appendChild(guide);
      }

      wrap.appendChild(page);
      pagesEl.appendChild(wrap);
    }

    requestAnimationFrame(() => {
      fitAll();
      const pages = Math.ceil(cards.length / 2);
      statusEl.textContent = `${cards.length} 位，共 ${pages} 頁 A4` + (imageSrc ? '，已套用圖片' : '，純文字');
    });
  }

  function scheduleRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 120);
  }

  imageInput.addEventListener('change', () => {
    const file = imageInput.files && imageInput.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      imageInput.value = '';
      imageState.textContent = '請選擇圖片檔';
      return;
    }
    const reader = new FileReader();
    reader.addEventListener('load', () => {
      imageSrc = String(reader.result || '');
      imageState.textContent = file.name;
      clearImageBtn.disabled = false;
      render();
    });
    reader.readAsDataURL(file);
  });

  clearImageBtn.addEventListener('click', () => {
    imageSrc = '';
    imageInput.value = '';
    imageState.textContent = '未使用圖片';
    clearImageBtn.disabled = true;
    render();
  });

  dataEl.addEventListener('input', scheduleRender);
  paddingEl.addEventListener('input', scheduleRender);
  gapEl.addEventListener('input', scheduleRender);
  renderBtn.addEventListener('click', render);
  printBtn.addEventListener('click', () => window.print());

  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    installPrompt = event;
    installBtn.hidden = false;
  });

  installBtn.addEventListener('click', async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    installBtn.hidden = true;
  });

  window.addEventListener('appinstalled', () => {
    installPrompt = null;
    installBtn.hidden = true;
  });
  window.addEventListener('resize', () => requestAnimationFrame(fitAll));
  window.addEventListener('beforeprint', fitAll);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  render();
})();
</script>
</body>
</html>
